name: Nx Affected CI
inputs:
  parallel:
    required: false
    default: '3'
  tag:
    required: false
  tasks:
    required: true
  configuration:
    required: false
    default: 'ci'
  args:
    required: false
runs:
  using: "composite"
  steps:
    - name: Fetch base branch for diff
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
      run: git fetch origin "$BASE_REF" --depth=1
    - name: Get last successful commit
      if: env.NX_BASE == ''
      uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4
    - name: Fallback to PR base if no base found
      if: env.NX_BASE == ''
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
      run: echo "NX_BASE=$(git rev-parse origin/$BASE_REF)" >> "$GITHUB_ENV"
    - name: Run affected command
      shell: bash
      env:
        NX_CONFIGURATION: ${{ inputs.configuration }}
        NX_TASKS: ${{ inputs.tasks }}
        NX_PARALLEL: ${{ inputs.parallel }}
        NX_TAG: ${{ inputs.tag }}
        NX_ARGS: ${{ inputs.args }}
      run: npx nx affected --nxBail --configuration="$NX_CONFIGURATION" -t="$NX_TASKS" --parallel="$NX_PARALLEL" --exclude="*,!tag:$NX_TAG" $NX_ARGS
