name: Feature request
description: Suggest a workflow or provider capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: Describe the workflow/business problem rather than only the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider (if applicable)
      placeholder: Meta, Twilio, 360dialog, Gupshup, provider-neutral
